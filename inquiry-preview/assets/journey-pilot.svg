<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1320 836" role="img" aria-labelledby="title desc"><title id="title">Value and pilot measures</title><desc id="desc">Three proposed interventions and the signals MK could measure after launch.</desc><rect x="0" y="0" width="1320" height="836" fill="#f8f9f7"/><rect x="0" y="0" width="1320" height="7" fill="#b6202a"/><text x="52" y="60" font-family="monospace" font-size="14" font-weight="600" fill="#0067a0">MK NORTH AMERICA   /   APPLICATION STUDIO</text><text x="1048" y="60" font-family="monospace" font-size="14" font-weight="500" fill="#455c69">FIELD GUIDE   /   02</text><text x="52" y="137" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" fill="#162e3c">What changes for the customer?</text><text x="52" y="185" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#455c69">Use comparable inquiries to establish a baseline. These are proposed pilot measures, not reported MK results.</text><rect x="52" y="222" width="1216" height="48" fill="#162e3c"/><text x="68" y="253" font-family="monospace" font-size="14" font-weight="600" fill="#fff">CUSTOMER TOUCHPOINT</text><text x="360" y="253" font-family="monospace" font-size="14" font-weight="600" fill="#fff">WHAT THE DEMO CHANGES</text><text x="802" y="253" font-family="monospace" font-size="14" font-weight="600" fill="#fff">WHAT TO COUNT</text><text x="52" y="310" font-family="monospace" font-size="14" font-weight="600" fill="#0067a0">01 / APPLICATION WEBSITE</text><text x="52" y="352" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">Find a relevant case</text><text x="345" y="312" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">Buyer starts with an application question.</text><text x="345" y="340" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">A search entry leads into MK’s tube-feeding</text><text x="345" y="368" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">page with its cited installation.</text><text x="789" y="312" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">Case visits that reach application review,</text><text x="789" y="340" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">divided by visits to the case. Compare by</text><text x="789" y="368" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">discovery source if attribution is available.</text><path d="M52 408 L1268 408" fill="none" stroke="#c8d1d3"/><text x="52" y="453" font-family="monospace" font-size="14" font-weight="600" fill="#0067a0">02 / 3D EXPLORER</text><text x="52" y="495" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">Understand the handoff</text><text x="345" y="455" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">A photograph establishes the machine.</text><text x="345" y="483" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">The buyer can now test a 70 mm rise and</text><text x="345" y="511" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">carry the difference into review.</text><text x="789" y="455" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">Number of clarification exchanges needed</text><text x="789" y="483" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">before engineering can assess an inquiry.</text><text x="789" y="511" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">Compare similar applications.</text><path d="M52 551 L1268 551" fill="none" stroke="#c8d1d3"/><text x="52" y="596" font-family="monospace" font-size="14" font-weight="600" fill="#0067a0">03 / ENGINEERING BRIEF</text><text x="52" y="638" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">Agree on the next step</text><text x="345" y="598" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">An R1 question and the customer’s answer</text><text x="345" y="626" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">remain together. R2 records the owner;</text><text x="345" y="654" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#455c69">the original PDF remains available.</text><text x="789" y="598" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">Confirmed briefs with a named owner and</text><text x="789" y="626" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">an agreed next step, divided by confirmed</text><text x="789" y="654" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162e3c">briefs reviewed in the pilot.</text><path d="M52 694 L1268 694" fill="none" stroke="#c8d1d3"/><text x="52" y="743" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#0067a0">Pilot question: who owns the receiving-side drawing, and how many exchanges does it take to find out?</text><path d="M52 773 L1268 773" fill="none" stroke="#c8d1d3"/><text x="52" y="809" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455c69">The demonstration sends no request to MK. No search ranking, conversion lift or engineering approval is claimed.</text><text x="1100" y="809" font-family="monospace" font-size="15" font-weight="600" fill="#0067a0">ANNORA / MK DEMO</text></svg>