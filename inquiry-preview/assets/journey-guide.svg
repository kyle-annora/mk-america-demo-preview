<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1320 836" role="img" aria-labelledby="title desc"><title id="title">Customer journey: from tube feeding to a confirmed brief</title><desc id="desc">Three chapters connect the buyer’s question, the 3D inspection and two confirmed engineering briefs.</desc><rect x="0" y="0" width="1320" height="836" fill="#f8f9f7"/><rect x="0" y="0" width="1320" height="7" fill="#b6202a"/><text x="52" y="60" font-family="monospace" font-size="14" font-weight="600" fill="#0067a0">MK NORTH AMERICA   /   APPLICATION STUDIO</text><text x="1048" y="60" font-family="monospace" font-size="14" font-weight="500" fill="#455c69">FIELD GUIDE   /   01</text><text x="52" y="137" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" fill="#162e3c">From tube feeding to a confirmed brief.</text><text x="52" y="185" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#455c69">One project follows the buyer from the first handling question to the next engineering conversation.</text><path d="M52 230 L441 230" fill="none" stroke="#c8d1d3"/><text x="52" y="265" font-family="monospace" font-size="13" font-weight="600" fill="#0067a0">01   /   BUYER</text><text x="52" y="311" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#162e3c">Find the application</text><g transform="translate(52 335)" fill="none" stroke="#0067a0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="5" width="128" height="65" rx="4"/><path d="M1 21h128M11 14h3m4 0h3m4 0h3M13 34h37m-37 9h25m-25 16h28"/><rect x="65" y="29" width="53" height="33" rx="2"/><path d="m70 55 13-9 9 5 13-15 8 7"/></g><text x="52" y="447" font-family="monospace" font-size="12" font-weight="600" fill="#455c69">01  SEARCH    →    02  WEBSITE</text><text x="52" y="497" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">“How do I move soft tubes</text><text x="52" y="527" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">one at a time?”</text><text x="52" y="583" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">A source-linked answer leads to</text><text x="52" y="611" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">MK’s published installation and</text><text x="52" y="639" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">a close-up of the tube pockets.</text><path d="M52 692 L441 692" fill="none" stroke="#c8d1d3"/><text x="52" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#162e3c">A relevant application to inspect.</text><path d="M465 230 L854 230" fill="none" stroke="#c8d1d3"/><text x="465" y="265" font-family="monospace" font-size="13" font-weight="600" fill="#0067a0">02   /   BUYER + ENGINEER</text><text x="465" y="311" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#162e3c">Inspect the transfer</text><g transform="translate(465 335)" fill="none" stroke="#0067a0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="m3 56 16 7 70-38 32 0 8 5-38 2-71 40-17-8zM20 63v12m52-40v24l7 4M3 56l68-38 19 7M22 46l17 8m-4-15 17 8m-4-15 17 8m-4-15 17 8"/><path stroke="#b6202a" d="M101 43h28m-4-5 5 5-5 5M117 34v22"/></g><text x="465" y="447" font-family="monospace" font-size="12" font-weight="600" fill="#455c69">03  LIVE 3D EXPLORER</text><text x="465" y="497" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">“Will it meet our</text><text x="465" y="527" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">receiving station?”</text><text x="465" y="583" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">Keep the discharge at 1,450 mm.</text><text x="465" y="611" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">Raise the proposed receiver to</text><text x="465" y="639" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">1,520 mm and inspect the joint.</text><path d="M465 692 L854 692" fill="none" stroke="#c8d1d3"/><text x="465" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#162e3c">One visible 70 mm difference.</text><path d="M878 230 L1267 230" fill="none" stroke="#c8d1d3"/><text x="878" y="265" font-family="monospace" font-size="13" font-weight="600" fill="#0067a0">03   /   BUYER → ENGINEER → BUYER</text><text x="878" y="311" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#162e3c">Close the loop</text><g transform="translate(878 335)" fill="none" stroke="#0067a0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M15 15h65l12 12v41H15zM80 15v13h12M24 32h37m-37 9h51m-51 9h40"/><path fill="#f3f6f6" d="M56 34h55l12 12v31H56z"/><path d="M110 34v12h13m-57 9h38m-38 9h24"/><path stroke="#b6202a" d="m102 65 5 5 10-12"/></g><text x="878" y="447" font-family="monospace" font-size="12" font-weight="600" fill="#455c69">04  REVIEW     05  R1     06  REPLY     07  R2</text><text x="878" y="497" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">“Who supplies the</text><text x="878" y="527" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#162e3c">receiving-side connection?”</text><text x="878" y="583" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">The buyer reviews R1. Engineering</text><text x="878" y="611" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">asks who owns the connection.</text><text x="878" y="639" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#455c69">The confirmed reply creates R2.</text><path d="M878 692 L1267 692" fill="none" stroke="#c8d1d3"/><text x="878" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#162e3c">Two PDFs and a named owner.</text><path d="M52 773 L1268 773" fill="none" stroke="#c8d1d3"/><text x="52" y="809" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455c69">Published installation: American Feeding Systems. Model, dimensions and decisions are illustrative.</text><text x="1100" y="809" font-family="monospace" font-size="15" font-weight="600" fill="#0067a0">ANNORA / MK DEMO</text></svg>